<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Heart Animation</title>
    <style>
        body,
        html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            width: 100%;
            height: 100%;
        }

        canvas {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
        }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();

        let particles = [];
        const particleCount = 150;

        function getHeartPoint(t) {
            const scale = Math.min(canvas.width, canvas.height) / 40;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
            return { x: x * scale, y: y * scale };
        }

        class Butterfly {
            constructor() { this.init(); }

            init() {
                this.t = Math.random() * Math.PI * 2;
                const target = getHeartPoint(this.t);
                this.x = canvas.width / 2;
                this.y = canvas.height / 2;
                this.targetX = target.x + canvas.width / 2;
                this.targetY = target.y + canvas.height / 2;
                this.size = Math.random() * 5 + 2;
                this.speed = Math.random() * 0.02 + 0.01;
                this.alpha = 0;
                this.color = `hsl(${200 + Math.random() * 30}, 100%, 70%)`;
            }

            draw() {
                ctx.save();
                ctx.beginPath();
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.alpha;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.ellipse(this.x, this.y, this.size, this.size * 1.5, Math.sin(Date.now() * 0.01), 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }

            update() {
                this.x += (this.targetX - this.x) * this.speed;
                this.y += (this.targetY - this.y) * this.speed;
                if (this.alpha < 1) this.alpha += 0.01;
                this.x += Math.sin(Date.now() * 0.1) * 0.5;
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        for (let i = 0; i < particleCount; i++) {
            setTimeout(() => particles.push(new Butterfly()), i * 20);
        }

        animate();

        window.addEventListener('resize', () => {
            resize();
            particles.forEach(p => p.init());
        });
    </script>
</body>

</html>
